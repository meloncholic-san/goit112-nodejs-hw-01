tags:
  - Contacts
summary: Get contact by ID
operationId: getContactById
description: Returns a contact by its ID.
security:
  - bearerAuth: []
parameters:
  - name: id
    in: path
    required: true
    schema:
      type: string
    description: ID of the contact to retrieve
responses:
  '200':
    description: Contact found
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 200
            message:
              type: string
              example: Successfully found contact!
            data:
              $ref: '../../../components/schemas/Contact.yaml'
  "401":
    $ref: '../../../responses/401.yaml'
  '404':
    description: Contact not found
    content:
      application/json:
        schema:
          type: object
          properties:
            status:
              type: integer
              example: 404
            message:
              type: string
              example: Contact not found
  "500": 
    $ref: '../../../responses/500.yaml'