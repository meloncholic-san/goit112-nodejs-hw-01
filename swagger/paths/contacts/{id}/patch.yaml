  tags:
    - Contacts
  summary: Update contact by ID
  operationId: updateContact
  description: Updates specified fields of a contact by ID.
  security:
    - bearerAuth: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
      description: The contact ID
  requestBody:
    required: true
    content:
      multipart/form-data:
        schema:
          $ref: '../../../components/schemas/ContactUpdate.yaml'  
  responses:
    '200':
      description: Contact updated successfully
      content:
        multipart/form-data:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 200
              message:
                type: string
                example: Successfully updated contact!
              data:
                $ref: '../../../components/schemas/Contact.yaml'
    '401':
      $ref: '../../../responses/401.yaml'
    '404':
      description: Contact not found
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 404
              message:
                type: string
                example: Contact not found
    '500':
      $ref: '../../../responses/500.yaml'
