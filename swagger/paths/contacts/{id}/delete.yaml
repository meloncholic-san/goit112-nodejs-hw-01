  tags:
    - Contacts
  summary: Delete a contact by ID
  operationId: deleteContact
  description: Deletes the contact with the specified ID.
  security:
    - bearerAuth: []
  parameters:
    - name: id
      in: path
      required: true
      schema:
        type: string
      description: The contact ID
  responses:
    '204':
      description: Contact deleted successfully. No content.
    '401':
      $ref: '../../../responses/401.yaml'
    '404':
      description: Contact not found
      content:
        application/json:
          schema:
            type: object
            properties:
              status:
                type: integer
                example: 404
              message:
                type: string
                example: Contact not found
    '500':
      $ref: '../../../responses/500.yaml'
