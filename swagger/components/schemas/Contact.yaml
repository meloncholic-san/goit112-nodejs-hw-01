type: object
properties:
  _id:
    type: string
    example: 507f191e810c19729de860ea
  name:
    type: string
    example: John Doe
  phoneNumber:
    type: string
    example: "+1234567890"
  email:
    type: string
    format: email
    nullable: true
    example: john.doe@example.com
  isFavourite:
    type: boolean
    example: false
  contactType:
    type: string
    enum: [work, home, personal]
    example: personal
  photo:
    type: string
    format: uri
    nullable: true
    example: "http://res.cloudinary.com/djqn3bly0/image/upload/v1750257506/srrludu9ktau9ekagvcm.jpg"
  createdAt:
    type: string
    format: date-time
    example: "2023-01-01T12:00:00.000Z"
  updatedAt:
    type: string
    format: date-time
    example: "2023-01-02T12:00:00.000Z"
required:
  - name
  - phoneNumber
  - contactType
